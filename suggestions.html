<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Suggestions - Mike's List</title>
    <script src="assets/theme.js"></script>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="kicker">Review automation</p>
        <h1>Suggestions</h1>
      </div>
      <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="siteNav">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav id="siteNav" class="nav-actions" aria-label="Project pages">
        <a class="source-link" href="index.html">Home</a>
        <a class="source-link" href="show-explorer.html">Show Explorer</a>
        <a class="source-link" href="mike-says.html">Mike Says</a>
        <a class="source-link" data-admin-only href="admin.html">Admin</a>
        <button class="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme">
          <svg class="theme-icon theme-icon-sun" aria-hidden="true" viewBox="0 0 32 32">
            <circle cx="16" cy="16" r="5"></circle>
            <path d="M16 2.5v5M16 24.5v5M2.5 16h5M24.5 16h5M6.1 6.1l4.6 4.6M21.3 21.3l4.6 4.6M25.9 6.1l-4.6 4.6M10.7 21.3l-4.6 4.6"></path>
          </svg>
          <svg class="theme-icon theme-icon-moon" aria-hidden="true" viewBox="0 0 32 32">
            <path d="M24.6 21.4A10.6 10.6 0 0 1 10.6 7.4 10.8 10.8 0 1 0 24.6 21.4Z"></path>
            <path class="theme-star" d="M22.8 5.5l.8 1.8 1.8.8-1.8.8-.8 1.8-.8-1.8-1.8-.8 1.8-.8.8-1.8Z"></path>
          </svg>
        </button>
      </nav>
    </header>

    <main class="admin-layout">
      <section class="source-intro">
        Suggested edits are generated from repeatable patterns and are not applied automatically.
      </section>

      <section class="summary" aria-label="Suggestion totals">
        <div>
          <strong id="suggestionTotal">0</strong>
          <span>suggestions</span>
        </div>
        <div>
          <strong id="artistSuggestionTotal">0</strong>
          <span>artist records</span>
        </div>
        <div>
          <strong id="eventSuggestionTotal">0</strong>
          <span>show records</span>
        </div>
        <div>
          <strong id="venueSuggestionTotal">0</strong>
          <span>venue records</span>
        </div>
      </section>

      <section class="suggestion-toolbar" aria-label="Suggestion filters">
        <button class="chip active" type="button" data-suggestion-group="all">All</button>
        <button class="chip" type="button" data-suggestion-group="artists">Artists</button>
        <button class="chip" type="button" data-suggestion-group="events">Shows</button>
        <button class="chip" type="button" data-suggestion-group="venues">Venues</button>
      </section>

      <section id="suggestionList" class="suggestion-list" aria-label="Suggested edits"></section>
    </main>

    <script src="data/review-suggestions.js"></script>
    <script src="assets/suggestions.js"></script>
    <script src="assets/nav.js"></script>
    <script src="assets/auth.js"></script>
  </body>
</html>
